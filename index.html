<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0e" />
  <title>pogadaj.se — gadaj, a nauczysz się angielskiego</title>
  <meta name="description" content="Osobisty nauczyciel AI do mówienia po angielsku. Rozmawiaj z Izabelą, popraw wymowę i przełam blokadę." />

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- Tło: kosmos / planety / rakietki (wg projektu logowania) -->
  <div class="cosmos" aria-hidden="true">
    <div class="stars"></div>
    <div class="planet planet--jupiter planet--a"></div>
    <div class="planet planet--jupiter planet--b"></div>
    <div class="planet planet--jupiter planet--c"></div>
    <div class="sky-rocket sky-rocket--1">
      <svg viewBox="0 0 60 30" width="60" height="30"><g fill="none" stroke="#8a8a96" stroke-width="2">
        <ellipse cx="30" cy="18" rx="22" ry="7"/><path d="M16 14 A16 10 0 0 1 44 14"/><circle cx="30" cy="11" r="3"/>
      </g></svg>
    </div>
    <div class="sky-rocket sky-rocket--2">
      <svg viewBox="0 0 60 30" width="44" height="22"><g fill="none" stroke="#7a7a86" stroke-width="2">
        <ellipse cx="30" cy="18" rx="22" ry="7"/><path d="M16 14 A16 10 0 0 1 44 14"/><circle cx="30" cy="11" r="3"/>
      </g></svg>
    </div>
    <!-- Rakieta Izabeli — leci przez ekran, ciągnąc za sobą IzabelaCode -->
    <div class="iza-rocket">
      <span class="iza-rocket__trail">IzabelaCode</span>
      <svg viewBox="0 0 120 48" width="104" height="42" aria-hidden="true">
        <!-- płomień -->
        <path d="M22 24c-8-6-16-6-20-4 5 2 5 6 0 8 4 2 12 2 20-4z" fill="#8fd3ff" opacity=".85"/>
        <path d="M26 24c-5-4-10-4-13-3 3 1.4 3 4.6 0 6 3 1 8 1 13-3z" fill="#d9f1ff" opacity=".9"/>
        <!-- tylna płetwa górna/dolna -->
        <path d="M34 14l-10-8c8-1 14 1 18 5z" fill="#6c85a6"/>
        <path d="M34 34l-10 8c8 1 14-1 18-5z" fill="#6c85a6"/>
        <!-- korpus -->
        <path d="M28 24c0-7 16-13 44-13 20 0 36 6 44 13-8 7-24 13-44 13-28 0-44-6-44-13z" fill="#a9bdd8"/>
        <path d="M28 24c0 7 16 13 44 13 20 0 36-6 44-13-2 9-22 15-46 15-26 0-42-7-42-15z" fill="#8aa2c2" opacity=".7"/>
        <!-- dziób -->
        <path d="M100 15c9 2 14 6 16 9-2 3-7 7-16 9 4-6 4-12 0-18z" fill="#6c85a6"/>
        <!-- okno -->
        <circle cx="66" cy="24" r="7" fill="#bfe9ff" stroke="#5b7ea6" stroke-width="2.5"/>
        <circle cx="63" cy="21" r="2" fill="#ffffff" opacity=".9"/>
      </svg>
    </div>
  </div>

  <!-- Tu router montuje aktywny ekran -->
  <main id="app" class="app-root" aria-live="polite">
    <!-- pusty placeholder (bez napisu ładowania); router montuje ekran -->
    <div id="boot"></div>
  </main>

  <!-- Toasty / powiadomienia -->
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <!-- Widoczny raport błędów (gdyby JS nie wystartował) -->
  <script>
    window.__bootError = function (msg) {
      var app = document.getElementById('app');
      if (!app) return;
      app.innerHTML = '<div style="max-width:560px;margin:12vh auto;padding:24px;border-radius:16px;'
        + 'background:#1a2150;border:1px solid #ff6b81;color:#eef2ff;font-family:system-ui">'
        + '<h2 style="margin:0 0 8px">Coś nie wystartowało</h2>'
        + '<p style="color:#aab3d8">Pokaż mi ten komunikat, a naprawię:</p>'
        + '<pre style="white-space:pre-wrap;background:#0a0e27;padding:12px;border-radius:10px;'
        + 'color:#ff7eb6;font-size:.85rem">' + String(msg) + '</pre></div>';
    };
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) {
        window.__bootError('Nie udało się wczytać pliku: ' + (t.src || t.href));
        return;
      }
      window.__bootError((e.error && e.error.stack) || e.message || e.filename + ':' + e.lineno);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      window.__bootError('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
    });
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
